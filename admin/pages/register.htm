<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register</title>
  <link rel="stylesheet" href="../../src/output.css" />
</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-sky-100 via-blue-50 to-indigo-100">

  <div class="w-[390px] bg-white rounded-2xl shadow-2xl p-8">

    <!-- Header -->
    <h2 class="text-3xl font-bold text-center text-blue-800">
      Qeydiyyat
    </h2>

    <p class="text-center text-gray-500 text-sm mt-2 mb-8">
      Yeni hesab yaratmaq üçün məlumatları doldurun
    </p>

    <!-- Full Name -->
    <div class="mb-4">
      <input
        type="text"
        placeholder="Ad Soyad"
        class="w-full px-4 py-3 border border-gray-200 rounded-xl outline-none
        focus:border-blue-400 focus:ring-4 focus:ring-blue-100 transition"
      />
    </div>

    <!-- Email -->
    <div class="mb-4">
      <input
        type="email"
        placeholder="E-poçt ünvanı"
        class="w-full px-4 py-3 border border-gray-200 rounded-xl outline-none
        focus:border-blue-400 focus:ring-4 focus:ring-blue-100 transition"
      />
    </div>

    <!-- Password -->
    <div class="mb-4 relative">
      <input
        id="password"
        type="password"
        placeholder="Şifrə"
        class="w-full px-4 py-3 pr-12 border border-gray-200 rounded-xl outline-none
        focus:border-blue-400 focus:ring-4 focus:ring-blue-100 transition"
      />

      <button
        type="button"
        onclick="showPassword()"
        class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-blue-600"
      >
        <!-- eye -->
        <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
          viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M2.458 12C3.732 7.943 7.523 5 12 5
            c4.478 0 8.268 2.943 9.542 7
            -1.274 4.057-5.064 7-9.542 7
            -4.477 0-8.268-2.943-9.542-7z" />
        </svg>

        <!-- eye off -->
        <svg id="eyeClosed" xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5 hidden" fill="none"
          viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M13.875 18.825A10.05 10.05 0 0112 19
            c-4.478 0-8.268-2.943-9.542-7
            a9.97 9.97 0 012.293-3.95M9.88 9.88
            A3 3 0 0114.12 14.12M3 3l18 18" />
        </svg>
      </button>
    </div>

    <!-- Confirm Password -->
    <div class="mb-6 relative">
      <input
        id="confirmPassword"
        type="password"
        placeholder="Şifrəni təkrar edin"
        class="w-full px-4 py-3 pr-12 border border-gray-200 rounded-xl outline-none
        focus:border-blue-400 focus:ring-4 focus:ring-blue-100 transition"
      />
    </div>

    <!-- Button -->
    <button
      onclick="register()"
      class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold
      py-3 rounded-xl transition shadow-md hover:shadow-lg"
    >
      Qeydiyyatdan keç
    </button>

    <!-- Footer -->
    <p class="text-center text-sm text-gray-500 mt-6">
      Artıq hesabınız var?
      <a href="login.htm" class="text-blue-600 hover:underline font-medium">
        Daxil olun
      </a>
    </p>

  </div>

  <script src="../js/auth.js"></script>

</body>
</html>
