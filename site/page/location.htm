<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
</head>
<body>
    <div
  id="car-card"
  class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 place-items-center"
>
  <!-- CARD 1 -->
  <div
    class="w-full max-w-[220px] rounded-2xl overflow-hidden border-2 border-[#1E1601] mt-10 relative bg-white shadow-md hover:shadow-xl duration-300 group"
  >
    <!-- Image -->
    <div class="overflow-hidden">
      <img
        src="../assets/img/car1.jpg"
        alt=""
        class="w-full h-[200px] object-cover group-hover:scale-110 duration-500"
      />
    </div>

    <!-- Price -->
    <div
      class="absolute top-2 right-2 z-10 bg-yellow-500 text-black px-3 py-1 rounded-xl font-bold text-sm shadow"
    >
      $315
    </div>

    <!-- Hover Icons -->
    <div
      class="absolute left-1/2 top-[55%] -translate-x-1/2 opacity-0 group-hover:opacity-100 duration-300 z-20"
    >
      <div
        class="bg-white rounded-2xl shadow-lg px-3 py-2 flex items-center gap-2"
      >
        <!-- Heart -->
        <div
          class="relative group/item cursor-pointer p-2 rounded-xl hover:bg-yellow-500 duration-300"
        >
          <i
            class="fa-solid fa-heart text-gray-700 hover:text-red-500 duration-300"
          ></i>

          <span
            class="absolute bottom-10 left-1/2 -translate-x-1/2 bg-black text-white text-[10px] px-2 py-1 rounded opacity-0 invisible group-hover/item:opacity-100 group-hover/item:visible duration-300 whitespace-nowrap"
          >
            Wishlist
          </span>
        </div>

        <!-- Compare -->
        <div
          class="relative group/item cursor-pointer p-2 rounded-xl hover:bg-yellow-500 duration-300"
        >
          <i class="fa-solid fa-code-compare text-gray-700"></i>

          <span
            class="absolute bottom-10 left-1/2 -translate-x-1/2 bg-black text-white text-[10px] px-2 py-1 rounded opacity-0 invisible group-hover/item:opacity-100 group-hover/item:visible duration-300 whitespace-nowrap"
          >
            Compare
          </span>
        </div>

        <!-- Search -->
        <div
          class="relative group/item cursor-pointer p-2 rounded-xl hover:bg-yellow-500 duration-300"
        >
          <i
            class="fa-solid fa-magnifying-glass text-gray-700 hover:text-blue-500 duration-300"
          ></i>

          <span
            class="absolute bottom-10 left-1/2 -translate-x-1/2 bg-black text-white text-[10px] px-2 py-1 rounded opacity-0 invisible group-hover/item:opacity-100 group-hover/item:visible duration-300 whitespace-nowrap"
          >
            Preview
          </span>
        </div>
      </div>
    </div>

    <!-- Button -->
    <button
      class="w-full py-3 bg-[#1E1601] text-yellow-500 flex items-center justify-center gap-2 font-semibold hover:bg-yellow-500 hover:text-black duration-300"
    >
      <i class="fa-solid fa-cart-shopping"></i>
      Add to cart
    </button>
  </div>

  <!-- CARD 2 (SALE) -->
  <div
    class="w-full max-w-[220px] rounded-2xl overflow-hidden border-2 border-[#1E1601] mt-10 relative bg-white shadow-md hover:shadow-xl duration-300 group"
  >
    <!-- Image -->
    <div class="overflow-hidden">
      <img
        src="../assets/img/car2.jpg"
        alt=""
        class="w-full h-[200px] object-cover group-hover:scale-110 duration-500"
      />
    </div>

    <!-- Price -->
    <div
      class="absolute top-2 right-2 z-10 bg-yellow-500 text-black px-3 py-1 rounded-xl font-bold text-sm shadow"
    >
      $315
    </div>

    <!-- Sale -->
    <div
      class="absolute top-2 left-2 bg-red-500 text-white px-2 py-1 rounded-full text-xs font-bold shadow"
    >
      SALE
    </div>

    <!-- Discount -->
    <div
      class="absolute top-10 left-2 bg-yellow-500 text-black px-2 py-1 rounded-full text-xs font-semibold shadow"
    >
      -25%
    </div>

    <!-- Hover Icons -->
    <div
      class="absolute left-1/2 top-[55%] -translate-x-1/2 opacity-0 group-hover:opacity-100 duration-300 z-20"
    >
      <div
        class="bg-white rounded-2xl shadow-lg px-3 py-2 flex items-center gap-2"
      >
        <div
          class="relative group/item cursor-pointer p-2 rounded-xl hover:bg-yellow-500 duration-300"
        >
          <a href="#">
            <i
              class="fa-solid fa-heart text-gray-700 hover:text-red-500 duration-300"
            ></i>
          </a>
        </div>

        <div
          class="relative group/item cursor-pointer p-2 rounded-xl hover:bg-yellow-500 duration-300"
        >
          <a href="#">
            <i class="fa-solid fa-code-compare text-gray-700"></i>
          </a>
        </div>

        <div
          class="relative group/item cursor-pointer p-2 rounded-xl hover:bg-yellow-500 duration-300"
        >
          <a href="#">
            <i
              class="fa-solid fa-magnifying-glass text-gray-700 hover:text-blue-500 duration-300"
            ></i>
          </a>
        </div>
      </div>
    </div>

    <!-- MARQUEE (toxunmadım) -->
    <marquee
      class="text-[#1E1601] border-y border-[#1E1601] bg-yellow-400 py-1 text-xs font-semibold"
      scrollamount="4"
      direction="left"
    >
      Whole Sale ⚡ Whole Sale ⚡ Whole Sale ⚡
    </marquee>

    <!-- Button -->
    <button
      class="cursor-pointer w-full py-3 bg-[#1E1601] text-yellow-500 flex items-center justify-center gap-2 font-semibold hover:bg-yellow-500 hover:text-black duration-300"
    >
      <i class="fa-solid fa-cart-shopping"></i>
      Add to cart
    </button>
  </div>
</div>

</body>
</html>
